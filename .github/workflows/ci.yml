name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: make verify
    # ubuntu-latest runners ship a running Docker daemon, which Testcontainers
    # needs to start the Postgres 16 used by the database tests.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Confirm Docker is available for Testcontainers
        run: docker info

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TEST_DATABASE_URL is deliberately not set: CI must exercise the
      # Testcontainers path, not a pre-provisioned database.
      - name: make verify
        run: make verify

      # Bundle-size budget (K2.22): exports the Android production JS bundle
      # and fails if it exceeds the budget in scripts/check-bundle-budget.ts.
      # The target user is often on an older Android with limited storage and
      # metered data, so size is a product constraint, not vanity.
      - name: Bundle-size budget
        run: pnpm check:bundle-budget

  docker:
    name: API image build + Postgres smoke test
    # K2.29: build the production image, boot it against a throwaway
    # Postgres 16, and assert /health (liveness) and /ready (readiness).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t raices-api:ci .

      - name: Start throwaway Postgres
        run: |
          docker run -d --name pg-ci \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=raices \
            postgres:16-alpine
          # Wait for Postgres to accept connections.
          for i in $(seq 1 30); do
            docker exec pg-ci pg_isready -U postgres && break
            sleep 1
          done

      - name: Run migrations from the image (pre-deploy entrypoint)
        run: |
          # K2.45: prove dist/migrate.mjs works from inside the image, the
          # same way Railway's pre-deploy command runs it. Twice: the first
          # applies, the second must be a no-op (idempotent re-runs).
          docker run --name migrate-ci \
            --link pg-ci:postgres \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/raices \
            -e MIGRATIONS_TARGET_DB=raices \
            raices-api:ci node dist/migrate.mjs
          docker run --name migrate-ci2 \
            --link pg-ci:postgres \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/raices \
            -e MIGRATIONS_TARGET_DB=raices \
            raices-api:ci node dist/migrate.mjs

      - name: Start the API container
        run: |
          docker run -d --name api-ci \
            --link pg-ci:postgres \
            -e DATABASE_URL=postgresql://postgres:postgres@postgres:5432/raices \
            -e PORT=3000 \
            -p 3000:3000 \
            raices-api:ci

      - name: Assert /health and /ready
        run: |
          # K2.45: the old loops never failed the step — 30 failed curls
          # still exited 0, so a broken image went green. Each loop now
          # records success and the step exits 1 if the endpoint never
          # answered. A build that succeeds and an image that runs are
          # different claims; this checks the second.
          # /health needs no DB: must be 200 as soon as the process is up.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              HEALTH_OK=1
              break
            fi
            sleep 1
          done
          if [ "${HEALTH_OK:-0}" != "1" ]; then
            echo "/health never returned 200"
            exit 1
          fi
          # /ready needs Postgres: 200 once the DB is reachable.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ready; then
              READY_OK=1
              break
            fi
            sleep 1
          done
          if [ "${READY_OK:-0}" != "1" ]; then
            echo "/ready never returned 200"
            exit 1
          fi
          echo "health: $(curl -s http://localhost:3000/health)"
          echo "ready:  $(curl -s http://localhost:3000/ready)"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs migrate-ci || true
          docker logs migrate-ci2 || true
          docker logs api-ci || true

      - name: Cleanup
        if: always()
        run: docker rm -f api-ci pg-ci migrate-ci migrate-ci2 || true
