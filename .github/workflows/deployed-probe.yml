name: Deployed API probe

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "BASE_URL to probe (must be HTTPS)"
        required: false
        default: "https://api-production-9b18.up.railway.app"
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  probe:
    name: Probe deployed API
    # Only run the post-deploy check when CI passed on main; manual
    # dispatches always run.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The workflow_run trigger fires when CI finishes, not when Railway
      # finishes deploying, so it can probe the PREVIOUS deployment. Poll
      # /health until its sha matches the commit CI just verified, bounded
      # at ~5 minutes. Manual dispatches skip this (no expected SHA).
      - name: Wait for deployed commit
        if: github.event_name == 'workflow_run'
        env:
          BASE_URL: ${{ inputs.base_url || 'https://api-production-9b18.up.railway.app' }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 30); do
            SHA=$(curl -sf "$BASE_URL/health" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).sha||'')}catch(e){}})")
            if [ "$SHA" = "$EXPECTED_SHA" ]; then
              echo "Deployed commit matches $EXPECTED_SHA"
              exit 0
            fi
            echo "Waiting for $EXPECTED_SHA (got '${SHA:-unreachable}'), attempt $i/30"
            sleep 10
          done
          echo "Timed out waiting for $EXPECTED_SHA to be live"
          exit 1

      - name: Run deployed probe
        env:
          BASE_URL: ${{ inputs.base_url || 'https://api-production-9b18.up.railway.app' }}
        run: node scripts/k3-deployed-probe.mjs
        # The probe exits non-zero on any failure or UNVERIFIED check.
        # That is correct: an unproven security property holds the gate red.
